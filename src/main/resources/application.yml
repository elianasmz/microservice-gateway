server:
  port: 8080

app:
  tomcat-microservices: http://localhost:9090

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      # Configuración de rutas
      routes:
        # ==================== AUTH SERVICE (público) ====================
        - id: auth-login
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/auth/login
            - Method=POST
          filters:
            - RewritePath=/auth/login, /users/auth/login
            - RemoveRequestHeader=Cookie
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: auth-register
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/auth/register
            - Method=POST
          filters:
            - RewritePath=/auth/register, /users/auth/register
            - RemoveRequestHeader=Cookie

        - id: auth-validate
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/auth/validate
            - Method=GET
          filters:
            - RewritePath=/auth/validate, /users/auth/validate

        # ==================== USER SERVICE (protegido) ====================
        - id: users-service
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /users/users/${segment}
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/users

        # ==================== ROLES SERVICE (protegido - solo admin) ====================
        - id: roles-service
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/roles/**
          filters:
            - RewritePath=/roles/(?<segment>.*), /users/roles/${segment}
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: roleCircuitBreaker
                fallbackUri: forward:/fallback/roles

        # ==================== USER-ROLES SERVICE (protegido) ====================
        - id: user-roles-service
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/user-roles/**
          filters:
            - RewritePath=/user-roles/(?<segment>.*), /users/user-roles/${segment}
            - AuthenticationFilter

        # Ruta especifica para carers/available
        - id: users-carers-available
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/users/carers/available
            - Method=GET
          filters:
            - AuthenticationFilter

        # ==================== SERVICE MICROSERVICE (protegido) ====================
        - id: services-microservice
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/services/**
          filters:
            - RewritePath=/services/(?<segment>.*), /services/${segment}
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: serviceCircuitBreaker
                fallbackUri: forward:/fallback/services

        - id: services-types-microservice
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/service-types/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: serviceCircuitBreaker
                fallbackUri: forward:/fallback/services

        # ==================== RESERVATION MICROSERVICE (protegido) ====================
        - id: reservations-microservice
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/apirest-reservations/**
          filters:
            - RewritePath=/apirest-reservations/(?<segment>.*), /reservations/${segment}
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: reservationCircuitBreaker
                fallbackUri: forward:/fallback/reservations

        # ==================== INVOICE MICROSERVICE (protegido) ====================
        - id: invoices-microservice
          uri: ${app.tomcat-microservices}
          predicates:
            - Path=/invoices/**
          filters:
            - RewritePath=/invoices/(?<segment>.*), /invoices/${segment}
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: invoiceCircuitBreaker
                fallbackUri: forward:/fallback/invoices

      # Configuración global de CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      # Configuración de timeouts
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

# =============================
# = JWT CONFIGURATION
# =============================
jwt:
  secret: m1Cl4v3S3cr3t4MuyLarg4yC0mplej4ParaJWT1234567890x
  expiration: 3600000

# =============================
# = ACTUATOR CONFIG
# =============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# =============================
# = LOGGING CONFIGURATION
# =============================
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"